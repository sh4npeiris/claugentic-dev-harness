# The harness's own test dependencies, as a PEP-735 dependency group — the SINGLE source of
# truth every CI job installs from (`python -m pip install --group test`). Declaring them here
# rather than in each workflow's install line is what closes the class of break that kept CI red
# 2026-08-01..2026-08-12: `tests/test_frontmatter_parses.py` imports `yaml` at module level, the
# workflow's hand-listed install line never mentioned pyyaml, and pytest died at COLLECTION — a
# red suite that read as a silent one. A new test dependency is now added in ONE place.
# Requires pip >= 25.1 for `--group` (the workflows upgrade pip before installing).
[dependency-groups]
test = ["pytest", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises a real git repo on disk (no mocked _git); slower, hermetic via tmp_path.",
]

[tool.ruff]
# EXCLUDE THE DEFECTIVE MATERIAL, NOT ALL OF eval/. Three directories hold code that is
# deliberately wrong: the two seeded exam fixtures and the build eval's mutant overlays.
# Linting those would flag the PLANTED flaws by design (every hit is part of an answer key,
# not cruft) and a per-line noqa would betray the no-self-labels contract the fixtures live
# under (see tests/test_eval_manifest.py). Describe the class, never the flaw — naming one
# here is a leak, and tests/test_eval_key_containment.py fails on it.
#
# Everything ELSE under eval/ is ordinary tooling and is linted like the rest of the repo:
# the build eval's measurement modules and its clean reference implementation get the same
# dead-code and undefined-name coverage as scripts/. (All of eval/ is still dev-only —
# stripped from the release by scripts/build_release.py — and still outside pytest's
# testpaths.)
extend-exclude = [
    "eval/fixture-defects",
    "eval/fixture-app",
    "eval/fixture-build/calibration/mutants",
]

[tool.ruff.lint.per-file-ignores]
# The one rule these modules cannot satisfy, exempted in ONE place with its reason rather
# than by scattered per-line directives (docs/claugentic-decisions/deterministic-gates.md
# forbids those). Both files import a target's modules by name, which only resolve AFTER the
# directory holding them is put on sys.path — so the path setup HAS to precede the imports.
# That is the design, not an oversight, and it is the whole reason these files exist.
"eval/fixture-build/checks/*.py" = ["E402"]
