# The harness's own test dependencies, as a PEP-735 dependency group — the SINGLE source of
# truth every CI job installs from (`python -m pip install --group test`). Declaring them here
# rather than in each workflow's install line is what closes the class of break that kept CI red
# 2026-08-01..2026-08-12: `tests/test_frontmatter_parses.py` imports `yaml` at module level, the
# workflow's hand-listed install line never mentioned pyyaml, and pytest died at COLLECTION — a
# red suite that read as a silent one. A new test dependency is now added in ONE place.
# Requires pip >= 25.1 for `--group` (the workflows upgrade pip before installing).
[dependency-groups]
test = ["pytest", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises a real git repo on disk (no mocked _git); slower, hermetic via tmp_path.",
]

[tool.ruff]
# eval/ is intentionally-defective fixture material — the seeded-defect "exam" the audit
# re-takes (eval/fixture-defects/) plus measurement fixtures. Linting it would flag the
# PLANTED defects by design (every such hit is part of the answer key, not cruft) and a
# per-line noqa would betray the fixture's no-self-labels contract (see
# tests/test_eval_manifest.py). Naming one here would publish an answer outside the
# manifest, which tests/test_eval_key_containment.py forbids — describe the class, never
# the seed. It is dev-only (stripped from the release,
# scripts/build_release.py) and already out of pytest's testpaths; exclude it from ruff too.
extend-exclude = ["eval"]
