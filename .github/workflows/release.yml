name: Release

# CI PUBLISHES (plan 0041 Slice 2). The maintainer's single act is pushing a `vX.Y.Z` tag;
# THIS workflow is the only publisher. It re-runs every deterministic gate AT THE TAGGED
# COMMIT, and only if they are all green does it push the `release` branch (what
# `/plugin install` serves) and create the GitHub Release.
#
# Two rules keep this honest:
#   * It NEVER hand-rolls the build. Publishing runs `scripts/build_release.py --apply` at the
#     tagged commit — the same one build path a maintainer runs locally. A second, YAML-shaped
#     implementation of the strip would drift from the tested one on its first edit.
#   * A red gate run publishes NOTHING — but the tag is already pushed, so that version number
#     is spent. Recover by bumping FORWARD to the next patch and tagging that; a tag is never
#     reused (`_version_increase_error` documents the exception, which is user-gated).
#
# `.github/` is stripped from the release, so this file never reaches an adopter — it runs from
# the tagged commit on `main`, which is exactly where it needs to be.
on:
  push:
    tags:
      - "v*"

# Least privilege, BY JOB. The default here is read-only, and the write capability is granted
# ONLY to `publish` (below). That matters because `gates` executes the whole test suite plus a
# global npm install from the network: with a workflow-level write token, anything running in
# that job could push any ref — including `release` and a fresh `v*` tag that re-enters this
# workflow. Nothing exploits that today; granting it at all is the thing this slice exists to
# prevent. Nothing anywhere needs packages, pages, id-token, or pull-requests.
permissions:
  contents: read

jobs:
  gates:
    name: release gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bounded wall clock: without this, a hung network call rides GitHub's 6-hour default.
    timeout-minutes: 25
    strategy:
      # Both legs run to completion: on a failed release you want the FULL picture, not the
      # first OS to break.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the on-main ancestry check below walks history, and the
          # base-ancestry/version guards the publish job runs need it too.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Assert the tagged commit is on main
        # THE authorization gate for "what makes this commit releasable". The build's existing
        # guard is the REVERSE inclusion (origin/main must be an ancestor of HEAD), which a
        # never-merged descendant satisfies — so without this, tagging any branch anywhere
        # publishes it. `git push origin main <tag>` was the only thing making this true, and a
        # habit is not a gate. Linux leg is enough: the fact is OS-independent.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main — a release must be tagged on a commit that landed on main. Push main with the tag, or merge first."
            exit 1
          fi
          echo "${GITHUB_SHA} is on origin/main"
      - name: Install test dependencies
        # The PEP-735 `test` group in pyproject.toml is the single source of truth (see ci.yml).
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test
      - name: Run the test suite
        run: python -m pytest
      - name: Assert helper tests exist (a zero-match glob exits 0 — vacuous green is forbidden)
        shell: bash
        run: ls tests/workflows/*.test.mjs
      - name: Run the workflow-script helper tests
        run: node --test tests/workflows/*.test.mjs
      - name: Architecture-tree index check
        run: python scripts/claugentic-check_architecture_tree.py
      - name: Plugin-version sync check
        run: python scripts/check_versions_synced.py
      - name: Managed-ledger byte-budget check
        run: python scripts/claugentic-check_doc_budgets.py
      - name: Shipped-content scan (stranded namespace tokens / dangling stripped-path refs)
        run: python scripts/check_shipped_content.py
      - name: Assert the tag matches plugin.json's version at this commit
        shell: bash
        # The version guard alone would let a HIGHER manifest version publish under a LOWER
        # tag (it only refuses non-increases). This closes that: the tag and the manifest must
        # name the same release, or adopters install content the tag misdescribes.
        run: |
          set -euo pipefail
          version="$(python -c "import json,pathlib;print(json.loads(pathlib.Path('.claude-plugin/plugin.json').read_text(encoding='utf-8'))['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match .claude-plugin/plugin.json version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} == plugin.json ${version}"
      - name: Install the Claude Code CLI
        # Linux only: the manifest validation is OS-independent, so paying for a global npm
        # install on both legs would buy nothing.
        if: runner.os == 'Linux'
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace manifest (strict)
        if: runner.os == 'Linux'
        # This validates `.claude-plugin/marketplace.json` — the catalog entry
        # `/plugin marketplace add|update` reads. The PLUGIN manifest is validated in the
        # publish job against the BUILT (stripped) tree: `--strict` warns on a root CLAUDE.md,
        # which is dev-only and present here but stripped from what adopters install, so the
        # honest place to validate the plugin is the tree that actually ships.
        run: claude plugin validate --strict .

  publish:
    name: publish (release branch + GitHub Release)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY write grant in this workflow — it pushes `release` and creates the Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        # Pinned rather than relying on whatever node the runner image ships: the Claude Code
        # CLI installed below is a node package, and the validation it performs is the last
        # gate before publishing.
        with:
          node-version: "22"
      - name: Configure the committer for the release build commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch origin/main (the build's base-ancestry anchor)
        # `build_release.py` refuses to build from a base that excludes any commit reachable
        # from `origin/main` (the dropped-work guard). It reads the remote-tracking ref, so
        # fetch it explicitly rather than relying on the checkout action's internal refspec.
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Snapshot origin/release (the lease anchor)
        shell: bash
        # CI cannot hold a human's `--force-with-lease` (there is no long-lived remote-tracking
        # ref to lease against), so we take the anchor explicitly here and compare + lease
        # against it at push time. Empty = the branch does not exist yet (first publish).
        run: |
          set -euo pipefail
          sha="$(git ls-remote origin refs/heads/release | cut -f1)"
          echo "RELEASE_LEASE_SHA=${sha}" >> "$GITHUB_ENV"
          echo "origin/release at job start: ${sha:-<none>}"
      - name: Extract the release notes from CHANGELOG.md
        shell: bash
        # Runs BEFORE anything is published so a missing changelog entry fails loud with zero
        # side effects. Written to RUNNER_TEMP, never the repo: an untracked file in the work
        # tree would trip `build_release.py`'s clean-tree precondition.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v h="## ${version}" '$0==h{f=1;next} f&&/^## /{exit} f{print}' CHANGELOG.md > "${notes_file}"
          if [ -z "$(tr -d '[:space:]' < "${notes_file}")" ]; then
            echo "::error::CHANGELOG.md has no '## ${version}' section — a release must say what changed."
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=${notes_file}" >> "$GITHUB_ENV"
      - name: Build the stripped release tree (the ONE build path, never hand-rolled)
        # `--apply` with no `--bump`: the version is already committed at the tagged commit.
        # This runs every precondition again (stale base, version guard, drop-check) and
        # validates the built tree's shipped content before it commits anything.
        run: python scripts/build_release.py --apply
      - name: Install the Claude Code CLI
        # Floating (resolves latest at run time) BY CHOICE, and it runs lifecycle scripts in the
        # job that holds the publish credential. See RELEASE_CHECKLIST -> Honest scope: a stale
        # validator pin is worse validation than a floating one, so this is an accepted,
        # recorded risk rather than an oversight.
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the BUILT release tree's plugin manifest (strict)
        shell: bash
        # The last gate before anything leaves this runner, run against the exact bytes about
        # to publish — this is the check that catches an unparseable skill/agent frontmatter
        # (the defect that shipped three consecutive releases before 0.5.1).
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/release-tree" release
          claude plugin validate --strict "${RUNNER_TEMP}/release-tree/.claude-plugin/plugin.json"
      # NOTE: a colon-space in an unquoted YAML scalar starts a nested mapping — the exact
      # defect that shipped three releases of broken skill frontmatter. Keep names free of it.
      - name: Publish the release branch (lease-equivalent guard against a concurrent publish)
        shell: bash
        run: |
          set -euo pipefail
          now="$(git ls-remote origin refs/heads/release | cut -f1)"
          if [ "${now}" != "${RELEASE_LEASE_SHA}" ]; then
            echo "::error::origin/release moved during this run (${RELEASE_LEASE_SHA:-<none>} -> ${now:-<none>}) — refusing to clobber a concurrent publish."
            exit 1
          fi
          if [ -z "${now}" ]; then
            git push origin refs/heads/release:refs/heads/release
          else
            git push --force-with-lease="refs/heads/release:${now}" origin refs/heads/release:refs/heads/release
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # IDEMPOTENT on purpose. This is the last step and the branch push is the one before it,
        # so a failure here leaves content already served — re-running the failed run is then the
        # correct recovery, and a re-run must not go red on "release already exists".
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists — nothing to create (re-run)."
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RELEASE_NOTES_FILE}"
          fi
