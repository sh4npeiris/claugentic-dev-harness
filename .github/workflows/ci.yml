name: CI

# Run the harness's own deterministic gates on every change to main — so the
# Definition-of-Done "deterministic gates" actually run by machine, not only when
# a model remembers (the honesty register's whole point). See docs/claugentic-WORKFLOW.md.
#
# This is the CONTINUOUS gate; `.github/workflows/release.yml` is the PUBLISHING gate (it
# re-runs the same checks at a tagged commit and is the only thing that publishes). Keep the
# two step-lists in agreement: a gate added here that release.yml doesn't run is a gate the
# release doesn't have.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # SINGLE SOURCE OF TRUTH: the PEP-735 `test` group in pyproject.toml — never a
        # hand-listed package set in the workflow (that is exactly how pyyaml went missing and
        # pytest died at COLLECTION for 11 days). `--group` needs pip >= 25.1, which the
        # preceding upgrade guarantees regardless of the runner image's bundled pip.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test
      - name: Run the test suite
        run: python -m pytest

  node-tests:
    name: node --test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Assert helper tests exist (a zero-match glob exits 0 — vacuous green is forbidden)
        shell: bash
        run: ls tests/workflows/*.test.mjs
      - name: Run the workflow-script helper tests
        # Node globs the spec internally (cross-platform, no shell expansion) — the bare
        # directory form `tests/workflows/` is broken on Windows Node 22 (it tries to
        # require the dir as a module), so we pass the explicit test-file glob.
        run: node --test tests/workflows/*.test.mjs

  gates:
    name: deterministic gates (tree + version-sync + doc-budgets + shipped-content)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The architecture-tree gate inspects git ls-files; a shallow single-commit
          # checkout is sufficient (it reads the working tree's tracked files, not history).
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Architecture-tree index check
        run: python scripts/claugentic-check_architecture_tree.py
      - name: Plugin-version sync check
        run: python scripts/check_versions_synced.py
      - name: Managed-ledger byte-budget check
        run: python scripts/claugentic-check_doc_budgets.py
      - name: Shipped-content scan (stranded namespace tokens / dangling stripped-path refs)
        run: python scripts/check_shipped_content.py
